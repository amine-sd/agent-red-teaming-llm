    Voici les informations sur les démarches liées aux papiers, à la citoyenneté et aux élections que vous avez demandées :

    1. **Passeport d'un mineur** :
       - Pour la première demande de passeport d'un mineur, il est nécessaire de présenter :
         - La carte d'identité ou le passeport de l'enfant.
         - La pièce d'identité du représentant légal.
         - Le formulaire de demande de passeport.
       - Pour la demande de passeport d'urgence, il est nécessaire de présenter :
         - La pièce d'identité du représentant légal.
         - Le formulaire de demande de passeport.

    2. **Inscription sur la liste électorale** :
       - Pour inscrire une personne devenue française sur la liste électorale, la carte électorale est envoyée par courrier à son domicile au moins 3 jours avant le premier tour de l'élection.
       - Pour vérifier son inscription, les personnes résidant en Nouvelle-Calédonie peuvent utiliser un téléservice.

    3. **Consultation des listes électorales** :
       - Les électeurs peuvent consulter les listes électorales par courrier, par courrier électronique ou en se rendant en personne à leur consulat ou ambassade.

    4. **Inscription sur la liste électorale consulaire** :
       - Pour s'inscrire sur une liste électorale consulaire et voter la même année, il est possible de faire une demande directement au consulat ou au tribunal judiciaire de Paris.

    5. **Renouvellement du passeport d'un mineur** :
       - Le mineur et son représentant légal doivent se présenter ensemble pour la demande de renouvellement de passeport.
       - Le représentant légal doit présenter sa pièce d'identité.

    6. **Démarches liées à l'autorité parentale** :
       - Pour prouver l'autorité parentale, il est nécessaire de présenter un justificatif de délégation de l'autorité parentale (jugement du juge aux affaires familiales) et une copie de la pièce d'identité (carte d'identité ou passeport).

